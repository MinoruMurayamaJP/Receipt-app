<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ed">
  <title>領収書作成</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fffdf8;
      --ink: #1d2428;
      --muted: #667075;
      --line: #d8d1c4;
      --accent: #0d7367;
      --accent-dark: #09564e;
      --shadow: 0 16px 36px rgba(29, 36, 40, 0.13);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Yu Gothic UI", Meiryo, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f4ed;
      color: var(--ink);
    }

    button, input, textarea, select { font: inherit; }

    .app {
      max-width: 1180px;
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 7vw, 42px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .status {
      min-width: 76px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.64);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 430px) minmax(340px, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel, .preview-shell {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.74);
      box-shadow: var(--shadow);
    }

    .panel { padding: 14px; }

    .section {
      padding: 12px 0;
      border-top: 1px solid rgba(216, 209, 196, 0.85);
    }

    .section:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .grid { display: grid; gap: 10px; }
    .two { grid-template-columns: 1fr 1fr; }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    input, textarea, select {
      width: 100%;
      min-height: 42px;
      border: 1px solid #cfc7ba;
      border-radius: 8px;
      padding: 10px 11px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(13, 115, 103, 0.14);
    }

    .line-items { display: grid; gap: 8px; }

    .item-row {
      display: grid;
      grid-template-columns: 1fr 72px 86px 36px;
      gap: 7px;
      align-items: end;
    }

    .icon-button, .primary, .secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-button {
      width: 36px;
      min-height: 36px;
      color: var(--muted);
      background: #f2efe8;
      border-color: #d8d1c4;
    }

    .primary {
      width: 100%;
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 800;
    }

    .primary:active { background: var(--accent-dark); }

    .secondary {
      width: 100%;
      color: var(--accent-dark);
      background: #fff;
      border-color: #b9cfc9;
      font-weight: 800;
    }

    .secondary:disabled {
      color: #9aa1a4;
      border-color: #ddd7ce;
      background: #f4f1eb;
    }

    .actions {
      position: sticky;
      bottom: calc(10px + env(safe-area-inset-bottom));
      display: grid;
      gap: 8px;
      padding-top: 12px;
      background: linear-gradient(180deg, rgba(247, 244, 237, 0), #f7f4ed 25%);
    }

    .preview-shell {
      padding: 16px;
      overflow: auto;
    }

    .receipt {
      width: min(100%, 760px);
      min-height: 980px;
      margin: 0 auto;
      padding: 44px 48px;
      background: var(--paper);
      border: 1px solid #d7d0c4;
      color: #15191c;
      box-shadow: 0 8px 26px rgba(29, 36, 40, 0.10);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
    }

    .receipt-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      border-bottom: 3px double #15191c;
      padding-bottom: 16px;
    }

    .receipt h2 {
      margin: 0;
      font-size: 40px;
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    .meta {
      display: grid;
      gap: 6px;
      min-width: 190px;
      font-size: 15px;
      text-align: right;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    .recipient {
      display: flex;
      align-items: end;
      gap: 10px;
      margin-top: 34px;
      padding-bottom: 8px;
      border-bottom: 1px solid #15191c;
      font-size: 26px;
    }

    .recipient-name {
      flex: 1;
      overflow-wrap: anywhere;
      font-weight: 700;
    }

    .amount-box {
      margin-top: 28px;
      border: 2px solid #15191c;
      display: grid;
      grid-template-columns: 120px 1fr;
      min-height: 82px;
      align-items: center;
    }

    .amount-label {
      align-self: stretch;
      display: grid;
      place-items: center;
      border-right: 1px solid #15191c;
      font-size: 20px;
      background: #f1ede4;
    }

    .amount {
      padding: 12px 20px;
      text-align: right;
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 800;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      overflow-wrap: anywhere;
    }

    .purpose {
      margin-top: 18px;
      font-size: 18px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .table {
      width: 100%;
      margin-top: 28px;
      border-collapse: collapse;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      font-size: 15px;
    }

    .table th, .table td {
      border: 1px solid #15191c;
      padding: 10px;
      vertical-align: top;
    }

    .table th {
      background: #f1ede4;
      text-align: left;
      font-weight: 800;
    }

    .num {
      text-align: right;
      white-space: nowrap;
    }

    .issuer-block {
      display: grid;
      grid-template-columns: 1fr 116px;
      gap: 22px;
      margin-top: 34px;
      align-items: start;
    }

    .issuer {
      line-height: 1.7;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .issuer-name {
      font-size: 20px;
      font-weight: 800;
    }

    .stamp {
      width: 108px;
      height: 108px;
      border: 4px double #b52222;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: #b52222;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-weight: 800;
      font-size: 18px;
      transform: rotate(-7deg);
      opacity: 0.78;
      text-align: center;
      white-space: pre-line;
      line-height: 1.35;
      overflow: hidden;
    }

    .stamp img {
      width: 94px;
      height: 94px;
      object-fit: contain;
      display: block;
    }

    .stamp.has-image {
      border-color: transparent;
      opacity: 1;
      transform: translateY(-14px);
    }

    .note {
      margin-top: 96px;
      padding-top: 12px;
      border-top: 1px solid #15191c;
      font-size: 13px;
      color: #444;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .image-result {
      display: none;
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 10px;
    }

    .image-result.active { display: block; }

    .image-result img {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid #e5ded3;
    }

    .hint {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .preview-shell { padding: 9px; }
      .receipt {
        padding: 26px 20px;
        min-height: 760px;
      }
      .receipt h2 { font-size: 31px; }
      .receipt-head {
        display: grid;
      }
      .meta {
        min-width: 0;
        text-align: left;
      }
      .recipient { font-size: 21px; }
      .amount-box { grid-template-columns: 88px 1fr; }
      .amount-label { font-size: 16px; }
      .amount {
        padding: 12px;
        font-size: 32px;
      }
      .item-row { grid-template-columns: 1fr 64px 78px 36px; }
      .table { font-size: 13px; }
      .table th, .table td { padding: 8px 6px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>領収書作成</h1>
      <div class="status" id="status">編集中</div>
    </header>

    <div class="layout">
      <form class="panel" id="receiptForm">
        <div class="section">
          <div class="section-title">基本情報</div>
          <div class="grid two">
            <label>発行日<input id="date" type="date"></label>
            <label>領収書番号<input id="number" type="text" inputmode="text" placeholder="R-0001"></label>
          </div>
          <div class="grid" style="margin-top:10px">
            <label>宛名<input id="recipient" type="text" placeholder="山田 太郎"></label>
            <label>但し書き<textarea id="purpose" placeholder="お食事代として"></textarea></label>
          </div>
        </div>

        <div class="section">
          <div class="section-title">
            <span>明細</span>
            <button class="icon-button" type="button" id="addItem" aria-label="明細を追加" title="明細を追加">＋</button>
          </div>
          <div class="line-items" id="items"></div>
        </div>

        <div class="section">
          <div class="section-title">税・表示</div>
          <div class="grid two">
            <label>税率
              <select id="taxRate">
                <option value="0.10">10%</option>
                <option value="0.08">8%</option>
                <option value="0">非課税</option>
              </select>
            </label>
            <label>金額入力
              <select id="taxMode">
                <option value="exclusive">税抜</option>
                <option value="inclusive" selected>税込</option>
              </select>
            </label>
          </div>
          <div class="grid two" style="margin-top:10px">
            <label>収入印紙
              <select id="revenueStamp">
                <option value="auto">自動表示</option>
                <option value="show">表示</option>
                <option value="hide">非表示</option>
              </select>
            </label>
            <label>印影
              <select id="stampMode">
                <option value="show">表示</option>
                <option value="hide">非表示</option>
              </select>
            </label>
          </div>
          <div class="grid" style="margin-top:10px">
            <label>領収印の画像<input id="stampImage" type="file" accept="image/*"></label>
            <button class="secondary" id="saveStampImage" type="button">この画像を次回も使う</button>
            <button class="secondary" id="clearStampImage" type="button">画像を解除</button>
            <button class="secondary" id="forgetStampImage" type="button">保存画像を削除</button>
          </div>
        </div>

        <div class="section">
          <div class="section-title">発行者</div>
          <div class="grid">
            <label>名称<input id="issuerName" type="text" placeholder="株式会社サンプル"></label>
            <label>住所<textarea id="issuerAddress" placeholder="〒100-0000 東京都..."></textarea></label>
            <label>電話・登録番号<input id="issuerMeta" type="text" placeholder="TEL 03-0000-0000 / T1234567890123"></label>
          </div>
        </div>

        <div class="section">
          <div class="section-title">備考</div>
          <label>メモ<textarea id="note" placeholder="上記正に領収いたしました。"></textarea></label>
        </div>

        <div class="actions">
          <button class="primary" id="makeImage" type="button">画像を生成</button>
          <button class="secondary" id="shareImage" type="button" disabled>共有・保存</button>
          <p class="hint">iPhoneでは生成後の画像を長押しして「写真に保存」できます。共有ボタン対応端末では保存先を選べます。</p>
        </div>
      </form>

      <section>
        <div class="preview-shell">
          <article class="receipt" id="receipt">
            <div class="receipt-head">
              <h2>領収書</h2>
              <div class="meta">
                <div>No. <span data-out="number"></span></div>
                <div>発行日 <span data-out="date"></span></div>
              </div>
            </div>

            <div class="recipient">
              <span class="recipient-name" data-out="recipient"></span>
              <span>様</span>
            </div>

            <div class="amount-box">
              <div class="amount-label">金額</div>
              <div class="amount" data-out="total"></div>
            </div>

            <div class="purpose">但し、<span data-out="purpose"></span></div>

            <table class="table">
              <thead>
                <tr>
                  <th>品目</th>
                  <th class="num">数量</th>
                  <th class="num">単価</th>
                  <th class="num">金額</th>
                </tr>
              </thead>
              <tbody id="receiptItems"></tbody>
              <tfoot>
                <tr><th colspan="3">小計</th><td class="num" data-out="subtotal"></td></tr>
                <tr><th colspan="3" data-out="taxLabel">消費税等（10%）</th><td class="num" data-out="tax"></td></tr>
                <tr><th colspan="3">合計</th><td class="num" data-out="totalSmall"></td></tr>
              </tfoot>
            </table>

            <div class="issuer-block">
              <div class="issuer">
                <div class="issuer-name" data-out="issuerName"></div>
                <div data-out="issuerAddress"></div>
                <div data-out="issuerMeta"></div>
              </div>
              <div class="stamp" id="stamp"></div>
            </div>

            <div class="note" data-out="note"></div>
          </article>
        </div>
        <div class="image-result" id="imageResult">
          <img id="receiptImage" alt="生成された領収書画像">
          <p class="hint">画像を長押しして保存できます。内容を変更した場合はもう一度「画像を生成」を押してください。</p>
        </div>
      </section>
    </div>
  </main>

  <script>
    const state = {
      imageBlob: null,
      imageFile: null,
      stampImageDataUrl: "",
      stampImageSrc: "",
      stampImageElement: null
    };
    const itemsEl = document.getElementById("items");
    const receiptItemsEl = document.getElementById("receiptItems");
    const statusEl = document.getElementById("status");
    const imageResultEl = document.getElementById("imageResult");
    const receiptImageEl = document.getElementById("receiptImage");
    const shareButton = document.getElementById("shareImage");
    const fields = ["date", "number", "recipient", "purpose", "taxRate", "taxMode", "revenueStamp", "stampMode", "issuerName", "issuerAddress", "issuerMeta", "note"];
    const stampStorageKey = "receipt-app.savedStampImage";

    function todayString() {
      const d = new Date();
      const offset = d.getTimezoneOffset() * 60000;
      return new Date(d.getTime() - offset).toISOString().slice(0, 10);
    }

    function text(id) {
      return document.getElementById(id).value.trim();
    }

    function formatDate(value) {
      if (!value) return "";
      const [y, m, d] = value.split("-");
      return `${y}年${Number(m)}月${Number(d)}日`;
    }

    function yen(value) {
      return new Intl.NumberFormat("ja-JP", {
        style: "currency",
        currency: "JPY",
        maximumFractionDigits: 0
      }).format(Math.round(value || 0));
    }

    function setOutput(name, value) {
      document.querySelectorAll(`[data-out="${name}"]`).forEach((el) => {
        el.textContent = value;
      });
    }

    function escapeAttr(value) {
      return String(value).replaceAll("&", "&amp;").replaceAll('"', "&quot;").replaceAll("<", "&lt;");
    }

    function escapeHtml(value) {
      return String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    }

    function addItem(values = {}) {
      const row = document.createElement("div");
      row.className = "item-row";
      row.innerHTML = `
        <label>品目<input class="item-name" type="text" placeholder="デザイン制作" value="${escapeAttr(values.name || "")}"></label>
        <label>数量<input class="item-qty" type="number" min="0" step="1" inputmode="decimal" value="${values.qty ?? 1}"></label>
        <label>単価<input class="item-price" type="number" min="0" step="1" inputmode="numeric" value="${values.price ?? ""}"></label>
        <button class="icon-button remove" type="button" aria-label="明細を削除" title="明細を削除">×</button>
      `;
      row.querySelector(".remove").addEventListener("click", () => {
        if (itemsEl.children.length > 1) {
          row.remove();
          updateDirty();
        }
      });
      row.querySelectorAll("input").forEach((input) => input.addEventListener("input", updateDirty));
      itemsEl.append(row);
      update();
    }

    function getItems() {
      return [...itemsEl.querySelectorAll(".item-row")].map((row) => {
        const name = row.querySelector(".item-name").value.trim() || "お食事代";
        const qty = Number(row.querySelector(".item-qty").value || 0);
        const price = Number(row.querySelector(".item-price").value || 0);
        return { name, qty, price, amount: qty * price };
      });
    }

    function totals(items) {
      const rate = Number(document.getElementById("taxRate").value);
      const mode = document.getElementById("taxMode").value;
      const entered = items.reduce((sum, item) => sum + item.amount, 0);
      if (mode === "inclusive" && rate > 0) {
        const subtotal = Math.round(entered / (1 + rate));
        return { subtotal, tax: entered - subtotal, total: entered };
      }
      const tax = Math.round(entered * rate);
      return { subtotal: entered, tax, total: entered + tax };
    }

    function taxLabel() {
      const rate = Number(document.getElementById("taxRate").value);
      return `消費税等（${Math.round(rate * 100)}%）`;
    }

    function update() {
      const items = getItems();
      const total = totals(items);
      setOutput("date", formatDate(text("date")));
      setOutput("number", text("number") || "R-0001");
      setOutput("recipient", text("recipient") || "お客様");
      setOutput("purpose", text("purpose") || "お食事代として");
      setOutput("issuerName", text("issuerName") || "発行者名");
      setOutput("issuerAddress", text("issuerAddress"));
      setOutput("issuerMeta", text("issuerMeta"));
      setOutput("subtotal", yen(total.subtotal));
      setOutput("taxLabel", taxLabel());
      setOutput("tax", yen(total.tax));
      setOutput("total", yen(total.total) + " -");
      setOutput("totalSmall", yen(total.total));
      updateStampPreview();

      receiptItemsEl.innerHTML = "";
      items.forEach((item) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${escapeHtml(item.name)}</td><td class="num">${item.qty || 0}</td><td class="num">${yen(item.price)}</td><td class="num">${yen(item.amount)}</td>`;
        receiptItemsEl.append(tr);
      });

      const stampSetting = document.getElementById("revenueStamp").value;
      const stampNeeded = stampSetting === "show" || (stampSetting === "auto" && total.total >= 50000);
      const noteText = [
        text("note") || "上記正に領収いたしました。",
        stampNeeded ? "収入印紙: 必要額をご確認ください。" : ""
      ].filter(Boolean).join(" / ");
      setOutput("note", noteText);
      updateStampPreview();
    }

    function updateStampPreview() {
      const stamp = document.getElementById("stamp");
      stamp.innerHTML = "";
      const src = state.stampImageDataUrl || state.stampImageSrc;
      stamp.classList.toggle("has-image", Boolean(src));
      stamp.style.display =
        document.getElementById("stampMode").value === "show" && src ? "grid" : "none";
      if (src) {
        const img = document.createElement("img");
        img.alt = "指定した領収印";
        img.src = src;
        stamp.append(img);
      }
    }

    function incrementReceiptNumber(currentNumber) {
      const match = String(currentNumber || "").match(/^(.*-)(\d+)$/);
      if (!match) return;
      const next = String(Number(match[2]) + 1).padStart(match[2].length, "0");
      document.getElementById("number").value = `${match[1]}${next}`;
    }

    function loadStampImage(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.addEventListener("load", () => {
        state.stampImageDataUrl = String(reader.result || "");
        state.stampImageSrc = "";
        state.stampImageElement = null;
        updateDirty();
      });
      reader.readAsDataURL(file);
    }

    function clearStampImage() {
      state.stampImageDataUrl = "";
      state.stampImageSrc = "";
      state.stampImageElement = null;
      document.getElementById("stampImage").value = "";
      updateDirty();
    }

    function saveStampImage() {
      const src = state.stampImageDataUrl || state.stampImageSrc;
      if (!src) {
        statusEl.textContent = "印鑑なし";
        return;
      }
      if (!state.stampImageDataUrl && state.stampImageSrc) {
        stampImageRenderSource().then((dataUrl) => {
          if (!dataUrl) return;
          localStorage.setItem(stampStorageKey, dataUrl);
          statusEl.textContent = "印鑑保存";
        }).catch(() => {
          statusEl.textContent = "保存失敗";
        });
        return;
      }
      try {
        localStorage.setItem(stampStorageKey, state.stampImageDataUrl);
        statusEl.textContent = "印鑑保存";
      } catch {
        statusEl.textContent = "保存失敗";
      }
    }

    function forgetSavedStampImage() {
      try {
        localStorage.removeItem(stampStorageKey);
        statusEl.textContent = "保存削除";
      } catch {
        statusEl.textContent = "削除失敗";
      }
    }

    function loadSavedStampImage() {
      let saved = "";
      try {
        saved = localStorage.getItem(stampStorageKey);
      } catch {
        return false;
      }
      if (!saved) return false;
      state.stampImageDataUrl = saved;
      state.stampImageSrc = "";
      state.stampImageElement = null;
      updateDirty();
      return true;
    }

    function loadDefaultStampImage() {
      const img = new Image();
      img.addEventListener("load", () => {
        state.stampImageSrc = "toranotora-stamp.png";
        state.stampImageElement = img;
        updateDirty();
      }, { once: true });
      img.src = "toranotora-stamp.png";
    }

    function ensureStampImageReady() {
      return new Promise((resolve) => {
        const src = state.stampImageDataUrl || state.stampImageSrc;
        if (!src) {
          resolve(null);
          return;
        }
        if (state.stampImageElement && state.stampImageElement.complete) {
          resolve(state.stampImageElement);
          return;
        }
        const img = new Image();
        img.onload = () => {
          state.stampImageElement = img;
          resolve(img);
        };
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    function updateDirty() {
      state.imageBlob = null;
      state.imageFile = null;
      shareButton.disabled = true;
      statusEl.textContent = "編集中";
      update();
    }

    async function makeImage() {
      update();
      statusEl.textContent = "生成中";
      await document.fonts.ready;
      await ensureStampImageReady();
      const generatedNumber = text("number") || "R-0001";
      const imageWidth = 760;
      const imageHeight = 980;
      renderReceiptElement(imageWidth, imageHeight).then((blob) => {
        state.imageBlob = blob;
        state.imageFile = new File([blob], `receipt-${generatedNumber}.png`, { type: "image/png" });
        receiptImageEl.src = URL.createObjectURL(blob);
        imageResultEl.classList.add("active");
        shareButton.disabled = false;
        incrementReceiptNumber(generatedNumber);
        update();
        statusEl.textContent = "生成済み";
      }).catch(() => {
        const scale = 2;
        const canvas = document.createElement("canvas");
        canvas.width = imageWidth * scale;
        canvas.height = imageHeight * scale;
        const ctx = canvas.getContext("2d");
        ctx.scale(scale, scale);
        drawReceipt(ctx, imageWidth, imageHeight, generatedNumber);
        canvas.toBlob((blob) => {
          state.imageBlob = blob;
          state.imageFile = new File([blob], `receipt-${generatedNumber}.png`, { type: "image/png" });
          receiptImageEl.src = URL.createObjectURL(blob);
          imageResultEl.classList.add("active");
          shareButton.disabled = false;
          incrementReceiptNumber(generatedNumber);
          update();
          statusEl.textContent = "生成済み";
        }, "image/png", 1);
      });
    }

    async function renderReceiptElement(width, height) {
      const receipt = document.getElementById("receipt");
      const clone = receipt.cloneNode(true);
      clone.style.width = `${width}px`;
      clone.style.minHeight = `${height}px`;
      clone.style.margin = "0";
      clone.style.boxShadow = "none";

      const stampImg = clone.querySelector("#stamp img");
      if (stampImg) {
        const src = await stampImageRenderSource();
        if (src) stampImg.setAttribute("src", src);
      }

      const styles = [...document.querySelectorAll("style")].map((style) => style.textContent).join("\n");
      const html = `
        <div xmlns="http://www.w3.org/1999/xhtml">
          <style>${styles}</style>
          ${clone.outerHTML}
        </div>
      `;
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
          <foreignObject width="100%" height="100%">${html}</foreignObject>
        </svg>
      `;
      const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
      try {
        const img = await loadImage(url);
        const scale = 2;
        const canvas = document.createElement("canvas");
        canvas.width = width * scale;
        canvas.height = height * scale;
        const ctx = canvas.getContext("2d");
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0, width, height);
        return await canvasToBlob(canvas);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          blob ? resolve(blob) : reject(new Error("画像生成に失敗しました"));
        }, "image/png", 1);
      });
    }

    async function stampImageRenderSource() {
      if (state.stampImageDataUrl) return state.stampImageDataUrl;
      if (!state.stampImageSrc) return "";
      try {
        const response = await fetch(state.stampImageSrc);
        const blob = await response.blob();
        return await blobToDataUrl(blob);
      } catch {
        return state.stampImageSrc;
      }
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function drawReceipt(ctx, width, height, receiptNumber) {
      const items = getItems();
      const total = totals(items);
      const pad = width < 620 ? 24 : 48;
      const right = width - pad;
      let y = pad;
      ctx.fillStyle = "#fffdf8";
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "#d7d0c4";
      ctx.lineWidth = 1;
      ctx.strokeRect(0.5, 0.5, width - 1, height - 1);
      ctx.fillStyle = "#15191c";
      ctx.textBaseline = "top";

      ctx.font = "700 40px serif";
      ctx.fillText("領収書", pad, y);
      ctx.font = "15px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(`No. ${receiptNumber || text("number") || "R-0001"}`, right, y + 4);
      ctx.fillText(`発行日 ${formatDate(text("date"))}`, right, y + 30);
      ctx.textAlign = "left";
      y += 70;
      line(ctx, pad, y, right, y, 3);
      y += 34;

      ctx.font = "700 25px serif";
      wrapText(ctx, `${text("recipient") || "お客様"} 様`, pad, y, right - pad, 34);
      y += 48;
      line(ctx, pad, y, right, y, 1);
      y += 28;

      ctx.strokeStyle = "#15191c";
      ctx.lineWidth = 2;
      ctx.strokeRect(pad, y, right - pad, 82);
      ctx.fillStyle = "#f1ede4";
      ctx.fillRect(pad + 1, y + 1, 118, 80);
      ctx.fillStyle = "#15191c";
      ctx.font = "20px serif";
      ctx.fillText("金額", pad + 38, y + 28);
      ctx.font = "800 44px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(`${yen(total.total)} -`, right - 18, y + 18);
      ctx.textAlign = "left";
      y += 106;

      ctx.font = "18px serif";
      y = wrapText(ctx, `但し、${text("purpose") || "お食事代として"}`, pad, y, right - pad, 28) + 14;

      const rowH = 40;
      const cols = [pad, right - 280, right - 190, right - 100, right];
      ctx.font = "700 14px sans-serif";
      drawCell(ctx, cols[0], y, cols[1] - cols[0], rowH, "品目", false, true);
      drawCell(ctx, cols[1], y, cols[2] - cols[1], rowH, "数量", true, true);
      drawCell(ctx, cols[2], y, cols[3] - cols[2], rowH, "単価", true, true);
      drawCell(ctx, cols[3], y, cols[4] - cols[3], rowH, "金額", true, true);
      y += rowH;
      ctx.font = "14px sans-serif";
      items.forEach((item) => {
        drawCell(ctx, cols[0], y, cols[1] - cols[0], rowH, item.name, false, false);
        drawCell(ctx, cols[1], y, cols[2] - cols[1], rowH, String(item.qty || 0), true, false);
        drawCell(ctx, cols[2], y, cols[3] - cols[2], rowH, yen(item.price), true, false);
        drawCell(ctx, cols[3], y, cols[4] - cols[3], rowH, yen(item.amount), true, false);
        y += rowH;
      });
      [["小計", total.subtotal], [taxLabel(), total.tax], ["合計", total.total]].forEach(([label, amount]) => {
        drawCell(ctx, cols[0], y, cols[3] - cols[0], rowH, label, false, true);
        drawCell(ctx, cols[3], y, cols[4] - cols[3], rowH, yen(amount), true, false);
        y += rowH;
      });
      y += 34;

      ctx.font = "800 20px sans-serif";
      const issuerTop = y;
      wrapText(ctx, text("issuerName") || "発行者名", pad, y, right - pad - 130, 28);
      ctx.font = "15px sans-serif";
      y += 34;
      y = wrapText(ctx, text("issuerAddress"), pad, y, right - pad - 130, 24);
      y = wrapText(ctx, text("issuerMeta"), pad, y + 2, right - pad - 130, 24);

      if (document.getElementById("stampMode").value === "show" && state.stampImageElement) {
        ctx.save();
        ctx.globalAlpha = 1;
        drawImageContained(ctx, state.stampImageElement, right - 118, issuerTop - 14, 108, 108);
        ctx.restore();
      }

      y += 96;
      line(ctx, pad, y, right, y, 1);
      ctx.font = "13px sans-serif";
      ctx.fillStyle = "#444";
      wrapText(ctx, document.querySelector('[data-out="note"]').textContent, pad, y + 12, right - pad, 20);
    }

    function line(ctx, x1, y1, x2, y2, width) {
      ctx.strokeStyle = "#15191c";
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function drawCell(ctx, x, y, w, h, value, rightAlign, head) {
      ctx.strokeStyle = "#15191c";
      ctx.lineWidth = 1;
      if (head) {
        ctx.fillStyle = "#f1ede4";
        ctx.fillRect(x, y, w, h);
      }
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = "#15191c";
      ctx.textAlign = rightAlign ? "right" : "left";
      ctx.fillText(String(value), rightAlign ? x + w - 8 : x + 8, y + 12);
      ctx.textAlign = "left";
    }

    function drawImageContained(ctx, img, x, y, w, h) {
      const ratio = Math.min(w / img.naturalWidth, h / img.naturalHeight);
      const dw = img.naturalWidth * ratio;
      const dh = img.naturalHeight * ratio;
      ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
    }

    function wrapText(ctx, textValue, x, y, maxWidth, lineHeight) {
      const chars = [...String(textValue || "")];
      let lineText = "";
      for (const char of chars) {
        const test = lineText + char;
        if (ctx.measureText(test).width > maxWidth && lineText) {
          ctx.fillText(lineText, x, y);
          lineText = char;
          y += lineHeight;
        } else {
          lineText = test;
        }
      }
      if (lineText) ctx.fillText(lineText, x, y);
      return y + lineHeight;
    }

    async function shareImage() {
      if (!state.imageFile) return;
      if (navigator.canShare && navigator.canShare({ files: [state.imageFile] })) {
        await navigator.share({ files: [state.imageFile], title: "領収書", text: "領収書画像" });
        return;
      }
      const link = document.createElement("a");
      link.href = URL.createObjectURL(state.imageBlob);
      link.download = state.imageFile.name;
      link.click();
    }

    function init() {
      document.getElementById("date").value = todayString();
      document.getElementById("number").value = `R-${todayString().replaceAll("-", "")}-001`;
      document.getElementById("recipient").value = "お客様";
      document.getElementById("purpose").value = "お食事代として";
      document.getElementById("taxMode").value = "inclusive";
      document.getElementById("issuerName").value = "株式会社 寅乃虎  ";
      document.getElementById("issuerAddress").value = "札幌市北区北11条西1丁目 1-15 EJI BLD.1F ";
      document.getElementById("issuerMeta").value = "TEL 011-513-3050 / 登録番号 T7430001085305";
      document.getElementById("note").value = "上記正に領収いたしました。";
      addItem({ name: "お食事代", qty: 1, price: 1000 });
      fields.forEach((id) => {
        document.getElementById(id).addEventListener("input", updateDirty);
        document.getElementById(id).addEventListener("change", updateDirty);
      });
      document.getElementById("stampImage").addEventListener("change", (event) => {
        loadStampImage(event.target.files && event.target.files[0]);
      });
      document.getElementById("saveStampImage").addEventListener("click", saveStampImage);
      document.getElementById("clearStampImage").addEventListener("click", clearStampImage);
      document.getElementById("forgetStampImage").addEventListener("click", forgetSavedStampImage);
      document.getElementById("addItem").addEventListener("click", () => addItem({ name: "", qty: 1, price: 1000 }));
      document.getElementById("makeImage").addEventListener("click", makeImage);
      shareButton.addEventListener("click", shareImage);
      if (!loadSavedStampImage()) loadDefaultStampImage();
      update();
    }

    init();
  </script>
